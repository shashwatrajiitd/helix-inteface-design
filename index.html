<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Helix · Templated Creative Generation</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { background: #FAF9F7; font-family: 'Geist', -apple-system, sans-serif; }
  .font-display { font-family: 'Fraunces', Georgia, serif; font-variation-settings: "opsz" 144, "SOFT" 30; }
  .font-mono    { font-family: 'Geist Mono', 'JetBrains Mono', monospace; }
  * { font-feature-settings: "ss01" on, "cv11" on; }
  @keyframes slide-in-from-right { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .animate-in { animation-duration: 260ms; animation-fill-mode: both; }
  .slide-in-from-right { animation-name: slide-in-from-right; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Build lucide icon component map -> window.LucideIcons.IconName
  (function () {
    const R = window.React;
    const { icons } = window.lucide;
    const mk = (name) => {
      const def = icons[name];
      if (!def) return null;
      return (props = {}) => {
        const { className = '', strokeWidth = 2, style = {} } = props;
        // lucide def shape: [tag, attrs, children] OR iconNode array of [tag, attrs] pairs
        let tag, attrs, children;
        if (Array.isArray(def) && def.length === 3 && typeof def[0] === 'string' && typeof def[1] === 'object') {
          [tag, attrs, children] = def;
        } else {
          // iconNode only — wrap in svg
          tag = 'svg';
          attrs = { xmlns: 'http://www.w3.org/2000/svg', width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeLinecap: 'round', strokeLinejoin: 'round' };
          children = def;
        }
        const kids = (children || []).map(([t, a], i) => R.createElement(t, { ...a, key: i }));
        return R.createElement(tag, {
          ...attrs,
          strokeWidth,
          className: `lucide ${className}`,
          style,
          ...(props.onClick ? { onClick: props.onClick } : {}),
        }, ...kids);
      };
    };
    const map = {};
    const want = ['Palette','Package','Megaphone','ShoppingCart','Image','FileText','Sparkles','Layers','Search','Bell','Grid3x3','List','Plus','ChevronDown','ChevronRight','ChevronLeft','ArrowRight','ArrowLeft','ArrowUpRight','Check','CheckCheck','AlertCircle','Clock','Flag','FolderOpen','X','Upload','Wand2','Info','Bot','Edit3','Play','Save','Type','Lock','Database','Circle','Box','TrendingUp','Eye','Download','Calendar','Calculator','Move','Paintbrush','MoreHorizontal','Zap'];
    want.forEach(name => { if (icons[name]) map[name] = mk(name); });
    // Fallbacks/aliases
    map.ImageIcon = map.Image || map.ImageIcon;
    if (!map.Grid3x3) map.Grid3x3 = mk('Grid3X3') || mk('LayoutGrid');
    // Debug signal
    window.__LucideMissing = want.filter(n => !map[n]);
    window.LucideIcons = map;
  })();
</script>
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/primitives.jsx"></script>
<script type="text/babel" src="src/nav.jsx"></script>
<script type="text/babel" src="src/configurator.jsx"></script>
<script type="text/babel" src="src/wizard.jsx"></script>
<script type="text/babel" src="src/run_modal.jsx"></script>
<script type="text/babel" src="src/library.jsx"></script>
<script type="text/babel">
  const { useState, useMemo } = React;
  const L = window.LucideIcons;

  function App() {
    const [persona, setPersona] = useState('brand');
    const [panel, setPanel] = useState('studio');
    const [view, setView] = useState('tracks');
    const [selectedTrack, setSelectedTrack] = useState(null);
    const [selectedTemplate, setSelectedTemplate] = useState(null);
    const [addTemplateOpen, setAddTemplateOpen] = useState(false);
    const [runModalOpen, setRunModalOpen] = useState(false);
    const [assetDetail, setAssetDetail] = useState(null);
    const [toast, setToast] = useState(null);

    const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3200); };

    const goHome = () => { setView('tracks'); setSelectedTrack(null); setSelectedTemplate(null); setPanel('studio'); };

    const breadcrumb = useMemo(() => {
      const crumbs = [];
      const p = window.PERSONAS.find(pp => pp.id === persona);
      crumbs.push({ label: p.label, onClick: goHome });
      if (panel === 'library') {
        crumbs.push({ label: 'Asset Library', onClick: () => {} });
      } else {
        if (selectedTrack) crumbs.push({ label: selectedTrack.label, onClick: () => { setView('templates'); setSelectedTemplate(null); } });
        if (selectedTemplate) crumbs.push({ label: selectedTemplate.name, onClick: () => {} });
      }
      return crumbs;
    }, [persona, panel, selectedTrack, selectedTemplate]);

    return (
      <div className="min-h-screen bg-[#FAF9F7]">
        <window.TopNav
          persona={persona}
          setPersona={(id) => { setPersona(id); }}
          panel={panel}
          setPanel={(p) => { setPanel(p); if (p === 'library') setView('tracks'); }}
          breadcrumb={breadcrumb}
          onHome={goHome}
        />

        {panel === 'studio' && view === 'tracks' && (
          <window.TracksView persona={persona} onSelectTrack={(t) => { setSelectedTrack(t); setView('templates'); }} />
        )}

        {panel === 'studio' && view === 'templates' && selectedTrack && (
          <window.TemplatesView
            track={selectedTrack}
            persona={persona}
            onAddTemplate={() => setAddTemplateOpen(true)}
            onSelectTemplate={(t) => { setSelectedTemplate(t); setView('detail'); }}
          />
        )}

        {panel === 'studio' && view === 'detail' && selectedTemplate && (
          <window.TemplateDetail
            template={selectedTemplate}
            onBack={() => { setView('templates'); setSelectedTemplate(null); }}
            onCreateRun={() => setRunModalOpen(true)}
          />
        )}

        {panel === 'library' && <window.AssetLibrary onOpenDetail={setAssetDetail} />}

        {addTemplateOpen && (
          <window.AddTemplateWizard
            onClose={() => setAddTemplateOpen(false)}
            onComplete={() => { setAddTemplateOpen(false); showToast('Template submitted for approval — Rhea P. notified'); }}
          />
        )}

        {runModalOpen && selectedTemplate && (
          <window.CreateRunModal
            template={selectedTemplate}
            onClose={() => setRunModalOpen(false)}
            onComplete={() => {
              setRunModalOpen(false);
              showToast('Run started — variants queued');
              setTimeout(() => { setPanel('library'); }, 1500);
            }}
          />
        )}

        {assetDetail && <window.AssetDetailDrawer asset={assetDetail} onClose={() => setAssetDetail(null)} />}

        {toast && (
          <div className="fixed bottom-6 right-6 z-50 bg-stone-900 text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-2 animate-in slide-in-from-right">
            <L.Check className="w-4 h-4 text-emerald-400" />
            <span className="text-[13px]">{toast}</span>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
